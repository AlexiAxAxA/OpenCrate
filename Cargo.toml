[workspace]
resolver = "2"
members = ["crates/oc-crypto", "crates/oc-format", "crates/oc-protocol", "crates/oc-policy", "crates/oc-engine", "crates/opencrate"]

# Keep the optional SDK on the same oc-crypto package as the local core during
# workspace development. Published packages resolve oc-crypto from crates.io.
[patch.crates-io]
oc-crypto = { path = "crates/oc-crypto" }

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
publish = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"

[profile.release]
overflow-checks = true
