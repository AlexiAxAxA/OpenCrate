[package]
name = "oc-protocol"
description = "Wire protocol documents for Open Crate access and authority flows"
repository = "https://github.com/AlexiAxAxA/OpenCrate"
homepage = "https://closecrate.com/"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
publish.workspace = true

[dependencies]
# Протокол стоит НА формате, а не рядом: общий тип ошибки, разборщик TLV,
# кодек политики и таблица версий живут в `oc-format`. Обратной стрелки нет и
# быть не может — ни один разборщик контейнера не зовёт ни один документ
# протокола, и это проверено до переноса.
oc-format = { version = "=0.0.3", path = "../oc-format" }
oc-crypto = { version = "=0.0.3", path = "../oc-crypto" }
oc-policy = { version = "=0.0.3", path = "../oc-policy" }

[lints]
workspace = true
