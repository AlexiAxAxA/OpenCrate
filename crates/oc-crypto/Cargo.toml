[package]
name = "oc-crypto"
description = "Cryptographic primitives and key schemes for Open Crate containers"
repository = "https://github.com/AlexiAxAxA/OpenCrate"
homepage = "https://closecrate.com/"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
publish.workspace = true

# `default-features = false` везде, где дефолт тянет getrandom.
#
# Это не оптимизация размера, а инвариант крейта. Правило «ни случайности из
# воздуха, ни часов» держалось на дисциплине вызывающего: сам crate источник
# энтропии не использовал, но ЗАВИСЕЛ от него транзитивно — `rand_core` со
# своими дефолтами и `chacha20poly1305` через фичу `getrandom` у `aead`.
# Поймала это сборка под wasm32-unknown-unknown, где `getrandom` без фичи
# `wasm_js` отказывается компилироваться: до тех пор чистота была заявлением, а
# не свойством.
#
# Практическое следствие помимо wasm: пока источник энтропии в графе есть, любой
# будущий вызов вроде `OsRng` компилируется молча, и ошибку заметит только ревью.
# Без него — ошибка сборки.
[dependencies]
blake3 = "1.8.6"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# Большие числа для проверки RSA-PSS (`rsa.rs`) — подписи редактировавшего
# устройства, версия 3 формата.
#
# Обоснование измерено, а не предположено: крейт в дереве УЖЕ был, пришёл с
# `p256`, и объявление его прямой зависимостью не добавило ни одного нового
# крейта — только рёбра. `cargo deny check licenses bans advisories sources` —
# чисто.
#
# Почему не крейт `rsa`: на нём RUSTSEC-2023-0071 (Marvin). К нашему употреблению
# он относится косвенно — атака про приватные операции, а подписывает TPM, — но
# исключение пришлось бы выписывать руками. Нам же нужно возведение в степень с
# ОТКРЫТЫМ показателем плюс разбор набивки: секретов в операции нет вовсе.
#
# `default-features = false` снимает `rand_core` — источник энтропии в этом
# крейте запрещён. Остаётся `alloc` ради `BoxedUint`.
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
hmac = "0.13.0"
# P-256 нужен потому, что Microsoft Platform Crypto Provider не даёт X25519:
# TPM 2.0 предоставляет ECDH P-256 и RSA. Чистая реализация здесь — не дубль
# аппаратной, а её обязательная пара: без неё согласование за трейтом
# `KeyAgreement` нечем проверить в CI, и весь путь к слоту на P-256 стал бы
# тестируемым только на машине с TPM.
#
# `default-features = false` снимает `std` (а с ним `getrandom` — источник
# энтропии ОС, который в этом крейте запрещён и однажды уже протекал сюда
# транзитивно), `ecdsa` (подписи здесь Ed25519, вторая подписная схема не нужна),
# `pem` и `precomputed-tables`. Остаётся `ecdh` — ровно согласование ключей.
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "alloc"] }
# Только трейты `Rng`/`CryptoRng`: генератор приходит параметром, а дефолтные
# фичи подключили бы ещё и `OsRng`.
rand_core = { version = "0.10.1", default-features = false }
# Постквантовая половина гибридного слота (`kem_id = 4`, X-Wing). Обоснование —
# три замера 2026-09-08, `spikes/ml-kem-cost/`: `cargo deny` на настоящем дереве
# чист, официальные векторы ACVP FIPS 203 сходятся (390 сравнений), цена ниже
# нынешнего X25519-слота. Пять новых крейтов на весь гибрид.
#
# `default-features = false` снимает `alloc`: ключи и шифротексты здесь
# фиксированной длины, куча им не нужна. `zeroize` ОБЯЗАТЕЛЕН — без него
# приватная половина остаётся на стеке как есть, а затирающий аллокатор стека
# не касается.
ml-kem = { version = "0.3.2", default-features = false, features = ["zeroize"] }
sha2 = "0.11.0"
# SHA3-256 для комбинатора X-Wing и SHAKE256 для роста пары из семени. Новых
# крейтов не даёт: тот же `sha3`, что приходит с `ml-kem`.
sha3 = { version = "0.11.0", default-features = false }
subtle = "2.6.1"
# `zeroize` ОБЯЗАТЕЛЕН: без него `Drop` у `StaticSecret` и `SharedSecret` пуст, и
# копия долговременного секрета устройства, сделанная для `diffie_hellman`,
# оставалась на стеке как есть — затирающий аллокатор стека не касается
# (ревью 2026-09-06). Новых крейтов фича не тянет: `zeroize` уже в графе.
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[features]
# Программный подписант RSA-PSS с зашитыми тестовыми ключами (`rsa_test_signer`).
# Только для `[dev-dependencies]` и стенда: продуктовый ключ правки — в TPM.
# Сторож — `cc-cli/tests/repository_hygiene.rs`.
test-signer = []
# ОПАСНЫЕ ФОРМЫ ЗАПЕЧАТЫВАНИЯ: `aead::seal_chunk` и `aead::seal_metadata`, куда
# nonce передаётся аргументом.
#
# Нужны они ровно двоим — замороженным векторам и пробам, которым требуется тот
# самый nonce, что записан в артефакте. Продуктовый путь их не зовёт: там стоят
# `seal_chunk_hedged` и `seal_metadata_hedged`, куда nonce вывести можно, а
# передать нечем. Повтор nonce на одном ключе раскрывает оба открытых текста
# XOR-ом и позволяет подделать тег (И-1), и удержать это может только подпись
# функции, а не абзац в докстроке.
#
# Только для `[dev-dependencies]`: признак выключен по умолчанию, и в списке
# `default` любого манифеста его ловит сторож
# `cc-cli/tests/repository_hygiene.rs`.
explicit-nonce = []
# МЕТКА ДОМЕНА ВНЕ РЕЕСТРА: `label::Label::ad_hoc`.
#
# Нужен двоим прототипам вне дерева (`experiments/attested-release`,
# `spikes/disclosure-capsules`), каждый из которых подписывает своё утверждение в
# своём домене и потому не вправе занимать номер в нормативном реестре §3.6.
#
# Продуктовый путь его не зовёт и звать не может: весь смысл типа `Label` в том,
# что значение берётся только из реестра, а реестр сверяется со спекой байт в
# байт (И-12). Включённый в поставке признак возвращает дверь, ради закрытия
# которой тип заведён, — поэтому он выключен по умолчанию и внесён в список
# непоставляемых (`cc-cli/tests/repository_hygiene.rs`).
ad-hoc-label = []

[lints]
workspace = true
