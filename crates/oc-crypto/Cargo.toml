[package]
name = "oc-crypto"
description = "Cryptographic primitives and key schemes for Open Crate containers"
repository = "https://github.com/AlexiAxAxA/OpenCrate"
homepage = "https://closecrate.com/"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
publish.workspace = true

# Callers supply randomness; dependency defaults must not add an OS RNG.
[dependencies]
blake3 = "1.8.6"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# Public-exponent RSA arithmetic. OAEP encoded input is secret and uses
# fixed-width values wrapped in Zeroizing; signature verification uses public input.
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
hmac = "0.13.0"
# Software ECDH counterpart for hardware P-256 agreement.
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "alloc"] }
# RNG traits only; the caller supplies the implementation.
rand_core = { version = "0.10.1", default-features = false }
# Fixed-size hybrid keys; zeroize private state on drop.
ml-kem = { version = "0.3.2", default-features = false, features = ["zeroize"] }
sha2 = "0.11.0"
# X-Wing combiner and seed expansion.
sha3 = { version = "0.11.0", default-features = false }
subtle = "2.6.1"
# Wipe StaticSecret and SharedSecret when dropped.
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[features]
# Fixture signer with embedded test keys; never use for real identities.
test-signer = []
# Test-only nonce control. Reusing a nonce under one key breaks AEAD security.
explicit-nonce = []
# Experimental labels outside the protocol registry; disabled by default.
ad-hoc-label = []

[lints]
workspace = true
