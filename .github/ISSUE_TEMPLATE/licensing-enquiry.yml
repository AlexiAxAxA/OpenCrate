name: Licensing enquiry
description: Ask about MPL-2.0, redistribution or contributions.
title: "[Licensing] "
labels: ["licensing"]
body:
  - type: markdown
    attributes:
      value: |
        Open Crate 0.0.3 uses
        [MPL-2.0](https://github.com/AlexiAxAxA/OpenCrate/blob/main/LICENSE).
        Commercial use does not require a separate agreement.
        **Issues are public.** Keep private business details out of the issue.
        The [licensing guide](https://github.com/AlexiAxAxA/OpenCrate/blob/main/docs/licensing.md) answers the common
        questions about covered files and earlier releases.
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - MPL-2.0 requirements for modified covered files
        - Contributing code
        - Redistribution, OEM or embedding in a product for third parties
        - Other
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Intended use
      description: What you are building with the core, which crates you need and roughly when you plan to ship. Keep it at the level you would put on a public website.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Private contact
      description: Optional contact if the question needs private follow-up.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I have not included business-sensitive figures or documents in this public issue.
          required: true
